[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "project-release-api"
version = "0.1.0"
description = "An AI-assisted project release API with a curated GitHub MCP gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "celery[redis]>=5.6,<6",
    "fastapi[standard]>=0.115",
    "fastmcp>=3.0,<4",
    "PyJWT>=2.9,<3",
    "pwdlib[argon2]>=0.2,<1",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["AGENTS.md"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
include = ["src*"]
